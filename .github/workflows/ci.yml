name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # The audio tests touch the real HAL, so this needs a macOS runner with a
    # working CoreAudio — a Linux container has no devices to enumerate.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        # Some tests need a device offering more than one sample rate and skip
        # themselves on a runner that has none. That is expected, not a pass
        # being faked: the ones that can run still assert.
        run: swift test

      - name: Build the virtual audio device
        # Compiling the driver catches the mistakes that matter most — a broken
        # AudioServerPlugIn takes coreaudiod down with all system audio.
        run: ./Driver/build-driver.sh

  format:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: |
          "$(xcrun --find swift-format)" lint --recursive --strict \
            Sources Tests 2>&1 | tee /tmp/lint.txt
          if [ -s /tmp/lint.txt ]; then
            echo "::error::swift-format reported issues"
            exit 1
          fi

  strings:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Neither the linter nor the flow check can see a user-facing literal that
      # was never passed through loc(): a wrapped one looks exactly like an
      # unwrapped one. Four survived every other check, including the whole
      # preferences sidebar.
      - name: Check that every user-facing string is localised
        run: ./App/check-strings.sh

  bundle:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # SwiftPM's Bundle.module falls back to the build directory, so an app
      # that never copied its resource bundle in works perfectly on the machine
      # that built it and dies on launch on every other one. Only running it
      # with the build tree out of reach can tell the difference.
      - name: Check the app bundle is self-contained
        run: ./App/build-app.sh --verify
